name: hourly refresh
on:
  schedule:
    - cron: "50 * * * *"     # hourly, :50 past
  workflow_dispatch:
concurrency: daily
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: pull and build
        working-directory: scripts
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          HELIUS_KEY: ${{ secrets.HELIUS_KEY }}
        run: |
          python -u pull_wallets.py
          python -u pull_evm.py
          # finished days live as small summaries in data/summary/, so only the last 3 days are pulled raw
          python -u pull_gacha.py $(date -u -d "3 days ago" +%F) 6 --budget 20
          python build_cards.py > /dev/null
      # the site reads src/data straight from this repo (re-checked every 5 min), so a push is enough: no redeploy.
      # cards.json is only committed if it covers at least as many days as the one live, so a bad run never shrinks the site.
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          live=$(git show HEAD:src/data/cards.json | python -c "import json,sys;print(json.load(sys.stdin)['coverage']['days'])")
          new=$(python -c "import json;print(json.load(open('src/data/cards.json'))['coverage']['days'])")
          echo "coverage: live $live days, this run $new days"
          git add data/raw/wallets data/raw/evm_base.csv data/raw/evm_robinhood.csv data/summary
          if [ "$new" -ge "$live" ]; then git add src/data; fi
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%FT%H:%MZ)"
          git push
